<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141a26">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Quirino Pedidos</title>
<link rel="stylesheet" href="etiqueta.css?v=2026-11-24-1">
<style id="pagesize"></style>
<style>
*{box-sizing:border-box}
:root{--top:#141a26;--blue:#1e5eff;--blue-l:#eaf0ff;--ink:#1d2433;--muted:#6b7385;--line:#e3e7ee;--bg:#f3f5f8;--card:#fff;--side:228px}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}
/* topo */
.top{position:fixed;inset:0 0 auto 0;height:52px;background:var(--top);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:30}
.top .logo{font-weight:800;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.top .logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--blue);font-style:normal;font-size:13px}
.top .sp{flex:1}
.top .sync{font-size:12px;opacity:.8;white-space:nowrap}
.top .out{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;padding:0 4px;cursor:pointer}
/* menu lateral */
.side{position:fixed;top:52px;bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:12px 10px;overflow:auto;z-index:25}
.side h4{margin:14px 10px 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:none}
.side h4:first-child{margin-top:2px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.side a:hover{background:#f4f6fa}
.side a.on{background:var(--blue-l);color:var(--blue);font-weight:700}
.side a .ic{width:20px;text-align:center}
.side .soon{margin-left:auto;font-size:10.5px;background:#fff3d6;color:#8a5a00;border-radius:6px;padding:1px 6px}
.main{margin-left:var(--side);padding:68px 22px 40px;max-width:1280px}
.shade{display:none}
h1.pg{font-size:19px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{height:38px;border:1px solid #cfd5df;border-radius:7px;padding:0 10px;background:#fff;min-width:0}
.btn{height:38px;border:0;border-radius:7px;padding:0 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cfd5df}
.btn.big{height:52px;font-size:17px;width:100%}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}
.chip b{font-size:15px}
.seg{display:inline-flex;border:1px solid #cfd5df;border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
/* marketplace */
.plat{display:inline-block;font-weight:900;font-size:11.5px;letter-spacing:.3px;padding:2px 8px;border-radius:5px;background:#000;color:#fff;white-space:nowrap}
.plat.mercado{background:#ffe600;color:#2d3277}.plat.shopee{background:#ee4d2d}.plat.tiktok{background:#000}
.st{display:inline-block;font-size:11.5px;border-radius:5px;padding:1px 7px;background:#eef1f6;color:#3a4357;white-space:nowrap}
/* tabela */
table.t{width:100%;border-collapse:collapse;background:#fff}
.t th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.grp td{background:#f6f8fb;font-weight:700;padding:7px 10px}
.prod{display:flex;gap:10px;align-items:flex-start;min-width:240px}
.prod+.prod{margin-top:8px}
.prod img,.ph{width:54px;height:54px;border-radius:6px;object-fit:cover;background:#eef1f6;flex:none}
.sku{font-weight:800}
.attr{font-weight:700;color:#334}
.qty{font-weight:900;font-size:15px;margin-left:auto;padding-left:6px}
.num{font-weight:800;color:var(--blue)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.late{color:#c4131a;font-weight:800}
/* leitor */
.order .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.order .bign{font-size:24px;font-weight:900}
.prazo{margin-top:10px;border-radius:10px;padding:11px;font-weight:800;font-size:17px;text-align:center}
.prazo small{display:block;font-weight:600;font-size:12.5px;opacity:.9}
.prazo.late{background:#2b0008;color:#fff}.prazo.red{background:#e5262b;color:#fff}.prazo.orange{background:#ffb44d;color:#2a1700}.prazo.ok{background:#1fa463;color:#fff}.prazo.none{background:#ddd}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.bigprod{display:flex;gap:12px;align-items:center}
.bigprod+.bigprod{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bigprod img,.bigprod .ph{width:110px;height:110px;border-radius:10px;cursor:zoom-in}
.bigprod .sku{display:inline-block;border:2px solid var(--ink);border-radius:7px;padding:1px 8px;font-size:17px}
.bigprod .attr{font-size:16px;margin-top:4px}
.bigprod .qty{font-size:26px}
.note{background:#fff7d6;border:1px solid #ecd27a;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.err{background:#fde8e8;border:1px solid #f3b4b4;color:#8a1010;border-radius:10px;padding:10px 12px;margin-bottom:12px}
/* login */
.login{position:fixed;inset:0;background:var(--top);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.login.on{display:flex}
.login .box{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:360px}
.login h2{margin:0 0 4px}
.login input{width:100%;height:44px;border:1px solid #cfd5df;border-radius:8px;padding:0 12px;margin:14px 0 10px;font-size:16px}
/* câmera e foto */
.cam,.zoom{position:fixed;inset:0;background:#000;z-index:60;display:none;align-items:center;justify-content:center}
.cam.on,.zoom.on{display:flex}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;width:68vmin;height:68vmin;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.cam .msg{position:absolute;top:18px;left:0;right:0;text-align:center;color:#fff;font-weight:700;padding:0 16px}
.cam .x,.zoom .x{position:absolute;bottom:26px;background:#fff;color:#000;border:0;border-radius:10px;padding:12px 22px;font-weight:800;font-size:16px}
.zoom img{max-width:100%;max-height:100%}
h2.sec{font-size:15px;margin:18px 2px 10px}
.loja{white-space:nowrap;line-height:1.9}
.loja b{font-weight:700}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;position:sticky;top:60px;z-index:5}
.selbar .sp{flex:1}
.selbar .ck{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
.selc{color:var(--muted)}.selc b{color:var(--blue)}
.t .cb{width:34px;text-align:center}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);cursor:pointer}
.t tr.sel td{background:#f2f6ff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cgrid .card{margin:0}
.cimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eef1f6;cursor:zoom-in}
.cimgs img.main{grid-column:1 / -1}
@media (max-width:820px){
  .burger{display:block}
  .top .sync{display:none}
  .side{transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  body.menu .side{transform:none}
  body.menu .shade{display:block;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.3);z-index:24}
  .main{margin-left:0;padding:64px 12px 40px}
  .t th.hm,.t td.hm{display:none}
  .selbar,.t .cb,.no-mob{display:none!important}
  .fld{flex:1 1 140px}
}
#printarea{display:none}
@media print{
  body.pl .top,body.pl .side,body.pl .main,body.pl .shade,body.pl .login,body.pl .cam,body.pl .zoom{display:none!important}
  body.pl #printarea{display:block}
  #printarea .lbl{box-shadow:none;border-radius:0}
  #printarea .lbl+.lbl{break-before:page;page-break-before:always}
  .top,.side,.no-print,.shade{display:none!important}
  .main{margin:0;padding:0}
  body{background:#fff}
  .card,.tw{border:0}
}
#elojaw{position:relative;min-width:220px}
.lsel summary{list-style:none;cursor:pointer;border:1px solid #cfd6e4;border-radius:8px;padding:0 34px 0 10px;line-height:36px;height:38px;background:#fff;font-size:14px;white-space:nowrap;position:relative;border-color:#cfd5df;border-radius:7px}
.lsel summary::-webkit-details-marker{display:none}
.lsel summary::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#555}
.lsel .lopts{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:300px;max-height:60vh;overflow:auto;background:#fff;border:1px solid #e1e5ee;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px 0}
.lsel .lopts label{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:14px;margin:0;color:#111;white-space:nowrap}
.lsel .lopts label:hover{background:#f3f5fa}
.lsel .lopts .lall{font-weight:700;border-bottom:1px solid #eef0f5}
.lsel .lopts .lc{margin-left:auto;color:#888;font-size:12px;padding-left:14px}
.lsel .lopts .plat{font-size:10px;padding:2px 5px}
</style>
</head>
<body>
<header class="top">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="logo"><i>QP</i>Quirino Pedidos</div>
  <div class="sp"></div>
  <div class="sync" id="sync"></div>
  <button class="out" id="out">Sair</button>
</header>
<nav class="side" id="side">
  <h4>Pedidos</h4>
  <a href="#ler" data-v="ler"><span class="ic">📷</span>Ler pedido</a>
  <a href="#envios" data-v="envios"><span class="ic">🚚</span>Lista de envios</a>
  <h4>Produtos</h4>
  <a href="#sku" data-v="sku"><span class="ic">🔎</span>Consultar SKU</a>
</nav>
<div class="shade" id="shade"></div>
<main class="main" id="main"></main>

<div id="printarea"></div>
<div class="login" id="login"><form class="box" id="loginf">
  <h2>Quirino Pedidos</h2>
  <div class="muted">Digite a senha da equipe para entrar.</div>
  <input type="password" id="pass" placeholder="Senha" autocomplete="current-password">
  <div class="err" id="lerr" style="display:none"></div>
  <button class="btn big" type="submit">Entrar</button>
</form></div>
<div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="msg" id="cmsg">Aponte para o QR code da etiqueta</div><button class="x" id="camx">Cancelar</button></div>
<div class="zoom" id="zoom"><img id="zimg" alt=""><button class="x" id="zx">Fechar</button></div>

<script src="config.js?v=2026-11-24-1"></script>
<script src="qrcode.js?v=2026-11-24-1"></script>
<script src="code128.js?v=2026-11-24-1"></script>
<script src="etiqueta.js?v=2026-11-24-1"></script>
<script>
(function(){
/* ===== configuração do banco (Supabase) ===== */
var CFG = window.QP_CONFIG || {};
var SB_URL = CFG.SB_URL || '';
var SB_KEY = CFG.SB_KEY || '';

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var PLAT={tiktok:'TIKTOK',mercado:'MERCADO LIVRE',shopee:'SHOPEE',shein:'SHEIN',amazon:'AMAZON',magalu:'MAGALU'};
var PCODE={t:'tiktok',m:'mercado',s:'shopee'};
var STATE={allocate:'Para Reservar',invoice_pending:'Para Emitir',to_ship:'Para Enviar',in_process:'Para Imprimir',to_pickup:'Para Retirada'};
function platTag(p){return '<span class="plat '+esc(p)+'">'+esc(PLAT[p]||String(p||'').toUpperCase())+'</span>'}
function stTag(s){return s?'<span class="st">'+esc(STATE[s]||s)+'</span>':''}
function z(n){return(n<10?'0':'')+n}
function fmtDT(d){if(!d)return '-';d=new Date(d);if(isNaN(d))return '-';return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes())}
function fmtH(d){d=new Date(d);return isNaN(d)?'-':z(d.getHours())+':'+z(d.getMinutes())}
function today(){var d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function prazo(t){
  if(!t) return{cls:'none',txt:'Sem prazo'};
  var left=new Date(t).getTime()-Date.now(),h=left/36e5,a=Math.abs(left),d=Math.floor(a/864e5),hh=Math.floor(a%864e5/36e5),mm=Math.floor(a%36e5/6e4);
  var dur=(d?d+'d ':'')+hh+'h'+(d?'':' '+mm+'min');
  return{cls:h<=0?'late':h<=24?'red':h<=48?'orange':'ok',txt:(h<=0?'ATRASADO há ':'Envio vence em ')+dur};
}
function img(u,cls){return u?'<img class="'+(cls||'')+'" src="'+esc(u)+'" referrerpolicy="no-referrer" loading="lazy" alt="" data-z="'+esc(u)+'">':'<div class="ph"></div>'}

/* ===== senha e banco ===== */
var PASS='';try{PASS=localStorage.getItem('qp_pass')||''}catch(e){}
var dbOn=SB_URL.indexOf('http')===0&&SB_KEY.length>20;
function rpc(fn,args){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t)}catch(e){}
      if(!r.ok){var m=(j&&(j.message||j.hint))||t;if(/senha/.test(m)){logout(true)}throw new Error(m)}return j})});
}
function logout(msg){PASS='';try{localStorage.removeItem('qp_pass')}catch(e){}showLogin(msg?'Senha inválida ou alterada. Digite de novo.':'')}
function showLogin(m){$('#login').classList.add('on');$('#lerr').style.display=m?'block':'none';$('#lerr').textContent=m||'';setTimeout(function(){$('#pass').focus()},50)}
$('#loginf').onsubmit=function(e){e.preventDefault();var p=$('#pass').value;
  rpc('qp_login',{p_pass:p}).then(function(ok){if(ok){PASS=p;try{localStorage.setItem('qp_pass',p)}catch(e){}$('#login').classList.remove('on');$('#pass').value='';info();route()}else showLogin('Senha incorreta.')})
  .catch(function(){showLogin('Não consegui conectar. Verifique a internet.')});};
$('#out').onclick=function(){logout(false)};
function info(){if(!dbOn||!PASS)return;rpc('qp_info',{p_pass:PASS}).then(function(j){if(!j)return;var s=j.last_sync?('Atualizado '+fmtDT(j.last_sync)):'Ainda sem sincronização';$('#sync').textContent=s+' · '+j.pending+' pedidos pendentes'}).catch(function(){})}

/* ===== menu ===== */
$('#burger').onclick=function(){document.body.classList.toggle('menu')};
$('#shade').onclick=function(){document.body.classList.remove('menu')};
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('.side a');if(a)document.body.classList.remove('menu');
  var im=e.target.closest&&e.target.closest('img[data-z]');if(im){$('#zimg').src=im.getAttribute('data-z');$('#zoom').classList.add('on')}
  var sc=e.target.closest&&e.target.closest('[data-scan]');if(sc){e.preventDefault();startCam()}
});
$('#zx').onclick=function(){$('#zoom').classList.remove('on')};

/* ===== QR das etiquetas (formato 3) ===== */
function dec(s){s=String(s||'');var out=[],i=0;while(i<s.length){var c=s[i];if(c==='_'){if(s[i+1]==='_'){out.push(32);i+=2;continue}var hx=s.substr(i+1,2);if(/^[0-9A-Fa-f]{2}$/.test(hx)){out.push(parseInt(hx,16));i+=3;continue}}out.push(c.charCodeAt(0));i++}try{return new TextDecoder('latin1').decode(new Uint8Array(out))}catch(e){return String.fromCharCode.apply(null,out)}}
function b64hex(b){b=b.replace(/-/g,'+').replace(/\./g,'/');while(b.length%4)b+='=';try{return Array.from(atob(b)).map(function(c){return('0'+c.charCodeAt(0).toString(16)).slice(-2)}).join('')}catch(e){return ''}}
function qimg(c){if(!c)return '';var k=c[0],v=c.slice(1);
  if(k==='t')return 'https://p16-oec-sg.ibyteimg.com/tos-alisg-i-aphluv4xwc-sg/'+b64hex(v)+'~tplv-aphluv4xwc-origin-jpeg.jpeg';
  if(k==='m'){var p=v.split('.');if(p.length===5)return 'https://http2.mlstatic.com/D_'+p[0]+'-'+p[1]+p[2]+'_'+p[3]+'-'+p[4]+'.jpg'}return ''}
function b36big(s){try{var n=0n;s=String(s||'').toLowerCase();for(var i=0;i<s.length;i++){var d=parseInt(s[i],36);if(isNaN(d))return s;n=n*36n+BigInt(d)}return n.toString()}catch(e){return s}}
function parseQR(h){h=String(h||'').replace(/^#/,'');var f=h.split('~');if(f[0]!=='3'||f.length<12)return null;
  var pos=(f[7]||'1.1').split('.');var pay=f[5]?String(parseInt(f[5],36)).padStart(10,'0'):'';var pd=/^(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(pay);
  return{num:dec(f[1]),plat_id:f[2]?b36big(f[2]):'',plat:PCODE[f[3]]||f[3],shop:dec(f[4]),pay_at:pd?new Date(2000+ +pd[1],pd[2]-1,pd[3],pd[4],pd[5]).toISOString():null,
    deadline:f[6]?new Date(parseInt(f[6],36)*1000).toISOString():null,idx:+pos[0]||1,n:+pos[1]||1,
    items:[{sku:dec(f[8]),attr:dec(f[9]),qty:+f[10]||1,img:qimg(f[11])}]}}

/* ===== telas ===== */
var VIEW='ler', QRDATA=null, LASTORDER=null;
function setOn(v){[].forEach.call(document.querySelectorAll('.side a'),function(a){a.classList.toggle('on',a.getAttribute('data-v')===v)})}
function route(){
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('3~')===0){QRDATA=parseQR(h);VIEW='ler'}
  else if(h==='envios'||h==='sku'||h==='ler'){VIEW=h;if(h!=='ler')QRDATA=null}
  setOn(VIEW);
  if(VIEW==='envios')vEnvios();else if(VIEW==='sku')vSku();else vLer();
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);

/* ---- Ler pedido ---- */
function vLer(){
  var h='<h1 class="pg">Ler pedido</h1>';
  h+='<div class="card no-print"><button class="btn big" data-scan>📷 Ler etiqueta</button>';
  h+='<form class="row" id="fnum" style="margin-top:12px"><div class="fld" style="flex:1"><label>Ou digite o nº do pedido (UP… ou nº da plataforma)</label><input id="qnum" placeholder="Ex.: UP1E3R313743" autocapitalize="characters"></div><button class="btn sec" type="submit">Buscar</button></form></div>';
  h+='<div id="res"></div>';
  $('#main').innerHTML=h;
  $('#fnum').onsubmit=function(e){e.preventDefault();var n=$('#qnum').value.trim();if(!n)return;QRDATA=null;loadOrder(n,null)};
  if(QRDATA){showOrder(QRDATA,true);if(dbOn&&PASS)loadOrder(QRDATA.num,QRDATA)}
  else $('#res').innerHTML='<div class="empty">Leia o QR code da etiqueta ou digite o número do pedido.</div>';
}
function loadOrder(num,fallback){
  if(!dbOn||!PASS){if(!fallback)$('#res').innerHTML='<div class="err">Entre com a senha para buscar pedidos.</div>';return}
  if(!fallback)$('#res').innerHTML='<div class="empty">Buscando…</div>';
  rpc('qp_order',{p_pass:PASS,p_num:num}).then(function(o){
    if(o){if(fallback){o.idx=fallback.idx;o.n=fallback.n}showOrder(o,false)}
    else if(!fallback)$('#res').innerHTML='<div class="err">Pedido '+esc(num)+' não encontrado entre os pedidos sincronizados.</div>';

/* ===== leitor de QR pela câmera ===== */
var stream=null,running=false,det=null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function loadJsQR(){return new Promise(function(ok,err){if(window.jsQR)return ok();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=ok;s.onerror=err;document.head.appendChild(s)})}
function stopCam(){running=false;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('#cam').classList.remove('on')}
function found(txt){var i=String(txt||'').indexOf('#'),h=i>=0?txt.slice(i+1):'';
  if(h.indexOf('3~')!==0){$('#cmsg').textContent='Esse QR não é de uma etiqueta da picklist';return false}
  stopCam();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}
  if(location.hash==='#'+h)route();else location.hash=h;return true}
function tick(){if(!running)return;var v=$('#vid');
  Promise.resolve().then(function(){
    if(v.readyState<2)return false;
    if(det)return det.detect(v).then(function(r){return r&&r.length?found(r[0].rawValue):false});
    if(window.jsQR){var w=v.videoWidth,hh=v.videoHeight,sc=Math.min(1,640/Math.max(w,hh));cv.width=w*sc;cv.height=hh*sc;cx.drawImage(v,0,0,cv.width,cv.height);var d=cx.getImageData(0,0,cv.width,cv.height);var q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});return q?found(q.data):false}
    return false;
  }).catch(function(){return false}).then(function(ok){if(!ok)setTimeout(tick,120)})}
function startCam(){$('#cmsg').textContent='Aponte para o QR code da etiqueta';$('#cam').classList.add('on');
  var pr=Promise.resolve();
  if('BarcodeDetector' in window)pr=BarcodeDetector.getSupportedFormats().then(function(f){if(f.indexOf('qr_code')>=0)det=new BarcodeDetector({formats:['qr_code']})}).catch(function(){});
  pr.then(function(){return det?null:loadJsQR()})
   .then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})})
   .then(function(s){stream=s;var v=$('#vid');v.srcObject=s;return v.play()}).then(function(){running=true;tick()})
   .catch(function(){$('#cmsg').textContent='Não consegui abrir a câmera. Permita o acesso à câmera no navegador ou use a câmera do celular.'})}
$('#camx').onclick=stopCam;

/* ===== início ===== */
if(dbOn&&!PASS&&location.hash.replace('#','').indexOf('3~')!==0)showLogin('');
info();setInterval(info,120000);
route();
})();
</script>

  function checar(){
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      if(!j||!j.v||j.v===APP_V) return;
      // já recarregou para essa versão e ela ainda não bate: não fica em loop
      if(new URLSearchParams(location.search).get('v')===j.v) return;
      novo=j.v; var b=document.getElementById('qpUpd'); b.style.display='flex';
      if(document.visibilityState==='hidden' || !ocupado()) setTimeout(function(){ if(!ocupado()) ir(); }, 8000);
    }).catch(function(){});
  }
  document.getElementById('qpUpdBtn').onclick=ir;
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') checar(); });
  setInterval(checar, 60000); setTimeout(checar, 3000);
})();
</script>
