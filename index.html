<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leitor de Pedidos – Quirino</title>
<style>
*{box-sizing:border-box}
:root{--ink:#1a1320;--muted:#6b6474;--bg:#f4f2f6;--card:#fff;--brand:#2e0929;--line:#e4e0ea}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.plat{font-weight:900;letter-spacing:.5px;color:#fff;background:#000;padding:6px 12px;border-radius:8px;font-size:18px}
.plat.t{background:#000}.plat.m{background:#ffe600;color:#2d3277}.plat.s{background:#ee4d2d}
.cnt{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.num{font-size:26px;font-weight:900;letter-spacing:.5px}
.sub{color:var(--muted);font-size:14px;margin-top:2px;word-break:break-all}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted)}
.row b{text-align:right}
.prazo{margin-top:10px;border-radius:12px;padding:12px;font-weight:800;font-size:18px;text-align:center}
.prazo.late{background:#2b0008;color:#fff}.prazo.red{background:#e5262b;color:#fff}.prazo.orange{background:#ffb44d;color:#2a1700}.prazo.ok{background:#1fa463;color:#fff}.prazo.none{background:#ddd}
.prazo small{display:block;font-weight:600;font-size:13px;opacity:.9}
h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.item{display:flex;gap:12px;align-items:center}
.item+.item{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.item img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#eee;flex:none}
.item .sku{display:inline-block;font-weight:900;font-size:18px;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;word-break:break-all}
.item .attr{font-weight:800;font-size:17px;margin-top:4px}
.item .nm{font-size:13px;color:var(--muted);margin-top:2px}
.item .q{margin-left:auto;font-size:26px;font-weight:900;flex:none}
.note{background:#fff7d6;border:1px solid #ecd27a;border-radius:12px;padding:10px 12px;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:var(--brand);color:#fff;margin-top:4px}
.empty{text-align:center;padding:40px 10px}
.empty .ic{font-size:56px}
.empty h1{font-size:22px;margin:10px 0 6px}
.empty p{color:var(--muted)}
/* galeria */
.gal{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
.gal.on{display:flex}
.gal .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 14px;font-weight:700}
.gal .x{background:#fff;color:#000;border:0;border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px}
.gal .sc{flex:1;overflow-y:auto;padding:0 10px 30px}
.gal figure{margin:0 0 18px}
.gal img{width:100%;border-radius:10px;background:#222}
.gal figcaption{color:#fff;font-weight:800;font-size:17px;margin-top:6px}
.gal figcaption span{display:block;font-weight:600;font-size:14px;opacity:.8}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="gal" id="gal"><div class="top"><span>Produtos do pedido</span><button class="x" id="galx">Fechar</button></div><div class="sc" id="galsc"></div></div>
<script>
(function(){
  var PLAT={t:'TIKTOK',m:'MERCADO LIVRE',s:'SHOPEE'};
  var $=function(s){return document.querySelector(s)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function dec(s){
    s=String(s||'');var out=[],i=0;
    while(i<s.length){var c=s[i];
      if(c==='_'){ if(s[i+1]==='_'){out.push(32);i+=2;continue}
        var hx=s.substr(i+1,2); if(/^[0-9A-Fa-f]{2}$/.test(hx)){out.push(parseInt(hx,16));i+=3;continue} }
      out.push(c.charCodeAt(0));i++;}
    try{return new TextDecoder('latin1').decode(new Uint8Array(out))}catch(e){return String.fromCharCode.apply(null,out)}
  }
  function b64hex(b){b=b.replace(/-/g,'+').replace(/\./g,'/');while(b.length%4)b+='=';try{return Array.from(atob(b)).map(function(c){return('0'+c.charCodeAt(0).toString(16)).slice(-2)}).join('')}catch(e){return ''}}
  function img(c){
    if(!c) return '';
    var k=c[0], v=c.slice(1);
    if(k==='t') return 'https://p16-oec-sg.ibyteimg.com/tos-alisg-i-aphluv4xwc-sg/'+b64hex(v)+'~tplv-aphluv4xwc-origin-jpeg.jpeg';
    if(k==='m'){var p=v.split('.'); if(p.length===5) return 'https://http2.mlstatic.com/D_'+p[0]+'-'+p[1]+p[2]+'_'+p[3]+'-'+p[4]+'.jpg';}
    return '';
  }
  function b36big(s){var n=0n;s=String(s||'').toLowerCase();for(var i=0;i<s.length;i++){var d=parseInt(s[i],36);if(isNaN(d))return s;n=n*36n+BigInt(d)}return n.toString()}
  function parse(h){
    h=(h||'').replace(/^#/,'');
    var f=h.split('~');
    if(f[0]!=='3'||f.length<12) return null;
    var pos=(f[7]||'1.1').split('.');
    var pay=f[5]?String(parseInt(f[5],36)).padStart(10,'0'):'';
    return{num:dec(f[1]),platId:f[2]?b36big(f[2]):'',plat:f[3],shop:dec(f[4]),pay:pay,dl:parseInt(f[6],36)||0,idx:+pos[0]||1,n:+pos[1]||1,
      items:[{sku:dec(f[8]),attr:dec(f[9]),qty:+f[10]||1,img:img(f[11]),name:''}],note:''};
  }
  function fmtPay(s){var m=/^(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)$/.exec(s||'');return m?m[3]+'/'+m[2]+'/20'+m[1]+' '+m[4]+':'+m[5]:(s||'-')}
  function fmtDl(t){if(!t)return '-';var d=new Date(t*1000);function z(n){return(n<10?'0':'')+n}return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes())}
  function prazo(t){
    if(!t) return{cls:'none',txt:'Sem prazo'};
    var left=t*1000-Date.now(),h=left/36e5,a=Math.abs(left),d=Math.floor(a/864e5),hh=Math.floor(a%864e5/36e5),mm=Math.floor(a%36e5/6e4);
    var dur=(d?d+'d ':'')+hh+'h'+(d?'':' '+mm+'min');
    return{cls:h<=0?'late':h<=24?'red':h<=48?'orange':'ok',txt:(h<=0?'ATRASADO há ':'Envio vence em ')+dur};
  }
  function render(){
    var o=parse(location.hash);
    if(!o){
      $('#app').innerHTML='<div class="empty"><div class="ic">📷</div><h1>Leitor de Pedidos</h1><p>Aponte a câmera do celular para o QR code da etiqueta da picklist. O pedido abre aqui com os dados da venda e as fotos dos produtos.</p>'+(location.hash.length>1?'<p style="font-size:11px;word-break:break-all;opacity:.6">Link não reconhecido: '+esc(location.hash.slice(0,200))+'</p>':'')+'</div>';
      return;
    }
    document.title=o.num+' – Leitor de Pedidos';
    var p=prazo(o.dl), pcs=o.items.reduce(function(s,i){return s+i.qty},0);
    var h='';
    h+='<div class="bar"><span class="plat '+esc(o.plat)+'">'+esc(PLAT[o.plat]||String(o.plat).toUpperCase())+'</span><span class="cnt">Produto '+o.idx+' de '+o.n+' do pedido</span></div>';
    h+='<div class="card"><div class="num">'+esc(o.num)+'</div>'+(o.platId?'<div class="sub">Pedido na plataforma: '+esc(o.platId)+'</div>':'');
    h+='<div class="prazo '+p.cls+'">'+esc(p.txt)+'<small>Prazo de envio: '+esc(fmtDl(o.dl))+'</small></div></div>';
    h+='<div class="card">'+(o.shop?'<div class="row"><span>Loja</span><b>'+esc(o.shop)+'</b></div>':'')+'<div class="row"><span>Pago em</span><b>'+esc(fmtPay(o.pay))+'</b></div><div class="row"><span>Envio até</span><b>'+esc(fmtDl(o.dl))+'</b></div></div>';
    if(o.note) h+='<div class="note">📝 '+esc(o.note)+'</div>';
    h+='<h2>Produtos</h2><div class="card">';
    o.items.forEach(function(i){
      h+='<div class="item">'+(i.img?'<img src="'+esc(i.img)+'" referrerpolicy="no-referrer" alt="">':'')+'<div><div class="sku">'+esc(i.sku)+'</div><div class="attr">'+esc(i.attr)+'</div>'+(i.name?'<div class="nm">'+esc(i.name)+'</div>':'')+'</div><div class="q">×'+i.qty+'</div></div>';
    });
    h+='</div>'+(o.n>1?'<div class="note">Este pedido tem '+o.n+' produtos. Leia o QR de cada etiqueta para ver os outros.</div>':'')+'<button class="btn" id="ver">Ver produto</button>';
    $('#app').innerHTML=h;
    $('#ver').onclick=function(){
      $('#galsc').innerHTML=o.items.map(function(i){return '<figure>'+(i.img?'<img src="'+esc(i.img)+'" referrerpolicy="no-referrer" alt="">':'')+'<figcaption>'+esc(i.sku)+' ×'+i.qty+'<span>'+esc(i.attr)+(i.name?' · '+esc(i.name):'')+'</span></figcaption></figure>'}).join('');
      $('#gal').classList.add('on');
    };
    window.scrollTo(0,0);
  }
  $('#galx').onclick=function(){$('#gal').classList.remove('on')};
  addEventListener('hashchange',render);
  render();
  setInterval(function(){if(!$('#gal').classList.contains('on'))render()},60000);
})();
</script>
</body>
</html>
